  - name: task_queue
    path: "superpowers-protocol/schemas/task_queue.schema.json"
  - name: validation_rules
    path: "superpowers-protocol/schemas/validation_rules.schema.json"
  - name: execution_result
    path: "superpowers-protocol/schemas/execution_result.schema.json"
  - name: validation_report
    path: "superpowers-protocol/schemas/validation_report.schema.json"
  - name: repair_task
    path: "superpowers-protocol/schemas/repair_task.schema.json"
  - name: receipt
