workflow_id: feature_build
version: "1.0.0"
purpose: Build a new feature using the full 12-skill protocol sequence including repair loop if validation fails.

trigger_conditions:
  - User requests a new feature, enhancement, or capability.
  - Repo has been previously assimilated and has a valid trust profile.

state_sequence:
  - DRAFT
  - INTAKE_LOCKED
  - CAPABILITY_MAPPED
  - CONTRACT_READY
  - TASK_READY
  - EXECUTING
  - VALIDATING
  - REPAIR_REQUIRED (if repairable failures)
  - REPAIRING (if repair needed)
  - VALIDATED
  - PROMOTED
  - RECEIPTED

skill_sequence:
  - step: 1
    skill_id: "00_goal_intake"
    input_from: user_request
    output_to: goal_artifact
  - step: 2
    skill_id: "01_repo_discovery"
    input_from: goal_artifact
    output_to: capability_evidence_raw
  - step: 3
    skill_id: "02_capability_evidence"
    input_from: capability_evidence_raw
    output_to: capability_evidence_final
  - step: 4
    skill_id: "03_contract_builder"
    input_from: capability_evidence_final
    output_to: execution_contract
  - step: 5
    skill_id: "04_task_queue_builder"
    input_from: execution_contract
    output_to: task_queue
  - step: 6
    skill_id: "05_validation_rule_builder"
    input_from: task_queue
    output_to: validation_rules
  - step: 7
    skill_id: "06_controlled_execution"
    input_from: validation_rules
    output_to: execution_result
  - step: 8
    skill_id: "07_validation_runner"
    input_from: execution_result
    output_to: validation_report
  - step: 9
    skill_id: "08_repair_planner"
    input_from: validation_report
    output_to: repair_task
    condition: overall_status == REPAIR_REQUIRED
  - step: 10
    skill_id: "06_controlled_execution"
    input_from: repair_task
    output_to: execution_result_repair
    condition: after repair_planner
  - step: 11
    skill_id: "07_validation_runner"
    input_from: execution_result_repair
    output_to: validation_report_final
    condition: after repair execution
  - step: 12
    skill_id: "09_receipt_writer"
    input_from: validation_report_final
    output_to: receipt
  - step: 13
    skill_id: "10_promotion_gate"
    input_from: receipt
    output_to: promotion_record

handoff_validations:
  - from: "00_goal_intake"
    to: "01_repo_discovery"
    required: true
  - from: "02_capability_evidence"
    to: "03_contract_builder"
    required: true
  - from: "05_validation_rule_builder"
    to: "06_controlled_execution"
    required: true
  - from: "07_validation_runner"
    to: "08_repair_planner"
    required: true
  - from: "08_repair_planner"
    to: "06_controlled_execution"
    required: true
  - from: "07_validation_runner"
    to: "09_receipt_writer"
    required: true

receipt_required_at:
  - VALIDATED
  - PROMOTED

failure_escalation_policy:
  BLOCKED_CONTRACT: Feature cannot be built with current capability evidence. Re-run assimilation or narrow scope.
  BLOCKED_EXECUTION: Stop. No self-repair. Surface the exact failure.
  BLOCKED_REPAIR: Repair exceeded max_attempts or attempted out-of-scope changes. Escalate to human.
  HUMAN_REVIEW: List the decision. Do not proceed without human input.

repair_loop:
  max_cycles: 3
  loop: steps 7 → 8 → 10 → 11 (repeat if REPAIR_REQUIRED, up to 3 times)
  on_exceeded: BLOCKED_REPAIR
