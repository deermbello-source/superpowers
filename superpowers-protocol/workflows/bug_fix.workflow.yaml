workflow_id: bug_fix
version: "1.0.0"
purpose: Fix a specific, identified bug without introducing new architecture or expanding scope.

trigger_conditions:
  - User reports a specific bug with observable behavior.
  - Repo has been previously assimilated.

state_sequence:
  - DRAFT
  - INTAKE_LOCKED
  - CAPABILITY_MAPPED
  - CONTRACT_READY
  - TASK_READY
  - EXECUTING
  - VALIDATING
  - REPAIR_REQUIRED (if repairable failures)
  - REPAIRING (if repair needed)
  - VALIDATED
  - PROMOTED
  - RECEIPTED

skill_sequence:
  - step: 1
    skill_id: "00_goal_intake"
    input_from: user_request
    output_to: goal_artifact
    note: goal_statement must name the specific bug and observable symptom
  - step: 2
    skill_id: "01_repo_discovery"
    input_from: goal_artifact
    output_to: capability_evidence_raw
    note: Abbreviated scan; focuses on the affected subsystem only
  - step: 3
    skill_id: "03_contract_builder"
    input_from: capability_evidence_raw
    output_to: execution_contract
    note: Skips full 02_capability_evidence if repo was previously assimilated
  - step: 4
    skill_id: "04_task_queue_builder"
    input_from: execution_contract
    output_to: task_queue
  - step: 5
    skill_id: "05_validation_rule_builder"
    input_from: task_queue
    output_to: validation_rules
  - step: 6
    skill_id: "06_controlled_execution"
    input_from: validation_rules
    output_to: execution_result
  - step: 7
    skill_id: "07_validation_runner"
    input_from: execution_result
    output_to: validation_report
  - step: 8
    skill_id: "09_receipt_writer"
    input_from: validation_report
    output_to: receipt
  - step: 9
    skill_id: "10_promotion_gate"
    input_from: receipt
    output_to: promotion_record

handoff_validations:
  - from: "03_contract_builder"
    to: "04_task_queue_builder"
    required: true
  - from: "05_validation_rule_builder"
    to: "06_controlled_execution"
    required: true
  - from: "07_validation_runner"
    to: "09_receipt_writer"
    required: true

receipt_required_at:
  - VALIDATED

failure_escalation_policy:
  BLOCKED_CONTRACT: Bug fix scope cannot be defined from available evidence. Expand to repo_assimilation first.
  BLOCKED_EXECUTION: Stop. The fix attempted something outside the contract. Surface the failure.
  HUMAN_REVIEW: Ambiguity about what constitutes the bug fix. List alternatives. Wait.

scope_constraints:
  - Fix only the reported bug. Do not refactor surrounding code.
  - Do not add features or tests beyond those needed to verify the fix.
  - If architecture change is needed to fix the bug, route to BLOCKED_CONTRACT.
